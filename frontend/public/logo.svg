<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <!-- Deep Navy Center Medallion Gradient -->
    <radialGradient id="compassMedallion" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a4055" />
      <stop offset="65%" stop-color="#0f2937" />
      <stop offset="100%" stop-color="#081b25" />
    </radialGradient>

    <!-- Antique Bronze Sunlit Facet -->
    <linearGradient id="bronzeFacetLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8a368" />
      <stop offset="100%" stop-color="#b6844b" />
    </linearGradient>

    <!-- Antique Bronze Shaded Facet -->
    <linearGradient id="bronzeFacetDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a3713b" />
      <stop offset="100%" stop-color="#86592a" />
    </linearGradient>

    <!-- Inner Metallic Bronze Ring -->
    <linearGradient id="bronzeRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cca26a" />
      <stop offset="45%" stop-color="#b3824c" />
      <stop offset="85%" stop-color="#996935" />
      <stop offset="100%" stop-color="#b88851" />
    </linearGradient>

    <!-- Single 3D Faceted Compass Star Ray at 0 degrees -->
    <g id="starRay">
      <polygon points="100,18 87.06,51.7 100,50" fill="url(#bronzeFacetLight)" />
      <polygon points="100,18 100,50 112.94,51.7" fill="url(#bronzeFacetDark)" />
      <line x1="100" y1="18" x2="100" y2="50" stroke="#7e532b" stroke-width="0.75" />
    </g>

    <!-- Single Dial Radial Needle and Winged Chevron Notch at 0 degrees -->
    <g id="dialRay">
      <line x1="100" y1="94" x2="100" y2="53" stroke="#ffffff" stroke-width="0.9" opacity="0.9" />
      <path d="M 94.5 56.5 Q 98 58 100 62.5 Q 102 58 105.5 56.5 Q 102 59.5 100 64 Q 98 59.5 94.5 56.5 Z" fill="#ffffff" opacity="0.95" />
    </g>
  </defs>

  <!-- 1. Pure White / Ivory Outer Base Disk -->
  <circle cx="100" cy="100" r="95" fill="#ffffff" />

  <!-- 2. Thick Outer Dark Navy/Petrol Ring -->
  <circle cx="100" cy="100" r="93" fill="none" stroke="#0d2735" stroke-width="6.5" />

  <!-- 3. Inner Antique Bronze Ring -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#bronzeRingGrad)" stroke-width="4.2" />

  <!-- 4. 12-Point 3D Faceted Compass Star Points -->
  <use href="#starRay" transform="rotate(0 100 100)" />
  <use href="#starRay" transform="rotate(30 100 100)" />
  <use href="#starRay" transform="rotate(60 100 100)" />
  <use href="#starRay" transform="rotate(90 100 100)" />
  <use href="#starRay" transform="rotate(120 100 100)" />
  <use href="#starRay" transform="rotate(150 100 100)" />
  <use href="#starRay" transform="rotate(180 100 100)" />
  <use href="#starRay" transform="rotate(210 100 100)" />
  <use href="#starRay" transform="rotate(240 100 100)" />
  <use href="#starRay" transform="rotate(270 100 100)" />
  <use href="#starRay" transform="rotate(300 100 100)" />
  <use href="#starRay" transform="rotate(330 100 100)" />

  <!-- 5. Center Midnight Navy Medallion Disk -->
  <circle cx="100" cy="100" r="50" fill="url(#compassMedallion)" stroke="#091b26" stroke-width="1.2" />

  <!-- 6. 12 Precision Radial Needles + Chevron Feather Glyphs -->
  <use href="#dialRay" transform="rotate(0 100 100)" />
  <use href="#dialRay" transform="rotate(30 100 100)" />
  <use href="#dialRay" transform="rotate(60 100 100)" />
  <use href="#dialRay" transform="rotate(90 100 100)" />
  <use href="#dialRay" transform="rotate(120 100 100)" />
  <use href="#dialRay" transform="rotate(150 100 100)" />
  <use href="#dialRay" transform="rotate(180 100 100)" />
  <use href="#dialRay" transform="rotate(210 100 100)" />
  <use href="#dialRay" transform="rotate(240 100 100)" />
  <use href="#dialRay" transform="rotate(270 100 100)" />
  <use href="#dialRay" transform="rotate(300 100 100)" />
  <use href="#dialRay" transform="rotate(330 100 100)" />

  <!-- 7. Center Brass & Silver Pivot Pin -->
  <circle cx="100" cy="100" r="4.2" fill="#0d2735" stroke="#ffffff" stroke-width="1.2" />
  <circle cx="100" cy="100" r="1.8" fill="#d49f63" />
</svg>
